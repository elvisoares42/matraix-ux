artifactName: user_feedback.json
instructions: |
  Responda com sinceridade, como a persona, depois de terminar a compra.
  Baseie-se em como foi usar o site e em quanto você confia no resultado.
fields:
  - key: overallExperienceRating
    prompt: No geral, que nota de 1 a 10 você dá para a experiência de compra?
    kind: integer
    minimum: 1
    maximum: 10
    explanation:
      key: reason
      prompt: Explique a nota com as suas palavras.
  - key: trustLevel
    prompt: De 1 a 10, quanto você confia que o pedido foi feito do jeito certo?
    kind: integer
    minimum: 1
    maximum: 10
  - key: wouldBuyAgain
    prompt: Você compraria de novo nesta loja?
    kind: enum
    choices: [sim, talvez, não]
